name: Build

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link IPA (decrypted, .ipa)"
        required: true
        type: string
      sdk_version:
        description: "iOS SDK version"
        required: false
        default: "16.5"
      target_version:
        description: "Minimum iOS target"
        required: false
        default: "14.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      # 1. Checkout DLTwitter
      - name: Checkout DLTwitter
        uses: actions/checkout@v4
        with:
          path: main

      # 2. Checkout Theos
      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          brew update
          brew install make dpkg ldid python3 pipx
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # 4. Cache iOS SDK
      - name: Cache iOS SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: theos/sdks/iPhoneOS${{ inputs.sdk_version }}.sdk
          key: ios-sdk-${{ inputs.sdk_version }}

      # 5. Download iOS SDK (sparse checkout)
      - name: Download iOS SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p theos/sdks
          cd theos/sdks
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS${{ inputs.sdk_version }}.sdk/*" > .git/info/sparse-checkout
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD

      # 6. Build tweak (.deb)
      - name: Build tweak
        working-directory: main
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          TARGET=iphone:clang:${{ inputs.sdk_version }}:${{ inputs.target_version }} \
            make clean package FINALPACKAGE=1
          ls -lh packages

      # 7. Download IPA
      - name: Download IPA
        working-directory: main
        run: |
          curl -L "${{ inputs.ipa_url }}" -o input.ipa
          file input.ipa

      # 8. Install pyzule-rw
      - name: Install pyzule-rw
        run: |
          pipx ensurepath
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          cyan --help

      # 9. Read IPA version (correct main app Info.plist)
      - name: Read IPA version
        working-directory: main
        run: |
          set +e

          unzip -q input.ipa -d ipa_tmp

          APP_PLIST=$(find ipa_tmp/Payload -maxdepth 2 -name "*.app" -type d | head -n 1)/Info.plist

          if [ ! -f "$APP_PLIST" ]; then
            echo "Main app Info.plist not found"
            VERSION="unknown"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PLIST" 2>/dev/null)

            if [ -z "$VERSION" ]; then
              VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PLIST" 2>/dev/null)
            fi

            if [ -z "$VERSION" ]; then
              VERSION="unknown"
            fi
          fi

          echo "IPA_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected IPA version: $VERSION"

          rm -rf ipa_tmp

      # 10. Inject tweak & rename IPA
      - name: Inject tweak into IPA (unsigned)
        working-directory: main
        run: |
          DEB_FILE="$(ls packages/*.deb | head -n 1)"
          OUTPUT_IPA="X_v${IPA_VERSION}_DLTwitter.ipa"

          cyan \
            -i input.ipa \
            -o "$OUTPUT_IPA" \
            -f "$DEB_FILE"

          echo "FINAL_IPA=$OUTPUT_IPA" >> $GITHUB_ENV

      # 11. Create Draft Release
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: "DLTwitter v${{ env.IPA_VERSION }}"
          tag_name: "v${{ env.IPA_VERSION }}"
          files: |
            main/packages/*.deb
            main/${{ env.FINAL_IPA }}