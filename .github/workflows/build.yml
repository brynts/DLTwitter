name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest

      env:
        THEOS: ${{ github.workspace }}/theos
        IPA_URL: https://DIRECT_LINK_IPA.ipa
        OUTPUT_IPA: DLTwitter-injected.ipa

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install system dependencies
          run: |
            sudo apt update
            sudo apt install -y \
              git curl wget unzip zip \
              build-essential clang \
              python3 python3-pip python3-venv \
              libssl-dev liblzma-dev

        - name: Setup Theos
          run: |
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
            echo "THEOS=$THEOS" >> $GITHUB_ENV
            mkdir -p "$THEOS/sdks"
            curl -L -o sdk.zip https://github.com/theos/sdks/releases/download/iOS-16.5/iPhoneOS16.5.sdk.zip
            unzip -q sdk.zip -d "$THEOS/sdks"
            rm sdk.zip

        - name: Build tweak (.deb)
          run: |
            make clean package FINALPACKAGE=1
            ls -lh packages

        - name: Download IPA
          run: |
            wget -O input.ipa "$IPA_URL"
            file input.ipa

        - name: Install pyzule-rw
          run: |
            pip3 install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
            cyan --help

        - name: Inject tweak into IPA (unsigned)
          run: |
            DEB_FILE="$(ls packages/*.deb | head -n 1)"
            echo "Using deb: $DEB_FILE"
            cyan -i input.ipa -o "$OUTPUT_IPA" -f "$DEB_FILE"

        - name: Upload artifacts
          uses: actions/upload-artifact@v4
          with:
            name: DLTwitter-build
            path: |
              packages/*.deb
              ${{ env.OUTPUT_IPA }}
